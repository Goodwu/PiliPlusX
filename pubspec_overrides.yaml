# Local source integration. Keep a current media-kit checkout next to this repo.
# Task CI resolves the registered media-kit branch afresh and verifies all roots.
dependency_overrides:
  flutter_inappwebview_android:
    git:
      url: https://github.com/bggRGjQaUbCoE/flutter_inappwebview.git
      path: flutter_inappwebview_android
      ref: v6.1.5
  cached_network_image_ce:
    git:
      url: https://github.com/My-Responsitories/flutter_cached_network_image_ce.git
      path: cached_network_image
      ref: develop
  media_kit:
    path: ../media-kit/media_kit
  media_kit_video:
    path: ../media-kit/media_kit_video
  media_kit_android_dataspace_vendor:
    path: ../media-kit/libs/android/media_kit_android_dataspace_vendor
  media_kit_libs_android_video:
    path: ../media-kit/libs/android/media_kit_libs_android_video
  media_kit_libs_ios_video:
    path: ../media-kit/libs/ios/media_kit_libs_ios_video
  media_kit_libs_macos_video:
    path: ../media-kit/libs/macos/media_kit_libs_macos_video
  media_kit_libs_linux:
    path: ../media-kit/libs/linux/media_kit_libs_linux
  media_kit_libs_ohos:
    path: ../media-kit/libs/ohos/media_kit_libs_ohos
  media_kit_libs_video:
    path: ../media-kit/libs/universal/media_kit_libs_video
  media_kit_libs_windows_video:
    path: ../media-kit/libs/windows/media_kit_libs_windows_video
