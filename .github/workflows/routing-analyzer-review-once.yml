name: Routing analyzer safe-fix review
on:
  push:
    branches: [routing/MK-ROUTING-20261011]
    paths: ['.github/workflows/routing-analyzer-review-once.yml']
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'Goodwu/PiliPlusX'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Goodwu/media-kit
          ref: routing/MK-ROUTING-20261011
          path: media-kit
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
          cache: false
          pub-cache-path: ${{ runner.temp }}/routing-safe-fix-pub
      - name: Prepare actual App SDK contracts
        run: |
          set -euo pipefail
          mkdir ci-analyzer-review
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'app=%s\nmediaKit=%s\n' "$GITHUB_SHA" "$(git -C ../media-kit rev-parse HEAD)" > ci-analyzer-review/heads.txt
          flutter pub get
          export GITHUB_WORKSPACE="$PWD"
          pwsh -NoLogo -NoProfile -File lib/scripts/patch.ps1 android > ci-analyzer-review/prepare.log 2>&1
          git diff --exit-code -- lib test
      - name: Apply only enumerated non-timing fixes
        run: |
          set -euo pipefail
          dart fix --apply --code=cascade_invocations,unnecessary_underscores,unnecessary_lambdas,prefer_const_constructors,always_use_package_imports,constant_identifier_names 2>&1 | tee ci-analyzer-review/fixes.log
          git diff --check
          git diff --binary -- lib test > ci-analyzer-review/changes.patch
          set +e
          flutter analyze --no-pub > ci-analyzer-review/analyze.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > ci-analyzer-review/analyze-exit.txt
      - name: Preserve non-workflow tree for authorized review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          root='https://api.github.com/repos/Goodwu/PiliPlusX'
          def api(path,data=None):
              req=urllib.request.Request(root+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req) as r:return json.load(r)
          paths=subprocess.check_output(['git','diff','--name-only','--','lib','test'],text=True).splitlines()
          if not paths or any(not p.endswith('.dart') or not p.startswith(('lib/','test/')) for p in paths):
              raise SystemExit('Unexpected source diff '+str(paths))
          entries=[{'path':p,'mode':'100644','type':'blob','content':Path(p).read_text()} for p in paths]
          head=os.environ['GITHUB_SHA']
          tree=api('/git/trees',{'base_tree':api('/git/commits/'+head)['tree']['sha'],'tree':entries})['sha']
          Path('ci-analyzer-review/tree.json').write_text(json.dumps({'head':head,'tree':tree,'paths':paths,'refsWritten':False,'timingFixesApplied':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-safe-analyzer-review-${{ github.sha }}
          path: app/ci-analyzer-review
          if-no-files-found: error
          retention-days: 14
