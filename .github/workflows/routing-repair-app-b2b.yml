name: Apply guarded App B2b lint and handoff repair
on:
  push:
    branches: [routing/MK-ROUTING-20261011]
    paths: ['.github/workflows/routing-repair-app-b2b.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply only reviewed lint edits and preserve implementation handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/routing/MK-ROUTING-20261011 | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 1a3dc7045e519689eb66d7560e0b64a63448671d HEAD
          python3 - <<'PY'
          import json, pathlib, subprocess
          page = pathlib.Path('lib/pages/video/controller.dart')
          text = page.read_text()
          edits = {
              "import 'package:PiliPlus/plugin/pl_player/hdr_output.dart';\n": '',
              '    if (identical(view, _routingView) && _routingDisplayId == view.display.id)\n      return;': '    if (identical(view, _routingView) && _routingDisplayId == view.display.id) {\n      return;\n    }',
              '        isFileSource)\n      return;': '        isFileSource) {\n      return;\n    }',
              '          serial != _routingQuerySerial)\n        return false;': '          serial != _routingQuerySerial) {\n        return false;\n      }',
          }
          for old, new in edits.items():
              assert text.count(old) == 1, repr(old)
              text = text.replace(old, new, 1)
          page.write_text(text)
          selector = pathlib.Path('lib/plugin/pl_player/source_selection.dart')
          text = selector.read_text()
          old = '      if (caps == null)\n        return DashRouteSelection.unknown(allowUnknown: allowUnknown);'
          assert text.count(old) == 1
          selector.write_text(text.replace(old, '      if (caps == null) {\n        return DashRouteSelection.unknown(allowUnknown: allowUnknown);\n      }', 1))
          path = pathlib.Path('docs/plans/media-kit-routing-app-handoff-20261011.json')
          data = json.loads(path.read_text())
          data['latestImplementation'] = {'commit': '384b10ae2fb02fe5909fec89597499ea314f3f4a', 'status': 'implemented', 'doNotRepeat': True, 'changes': ['Target-aware query without Player/global stale cache', 'Per-DASH-rendition source-spec filtering before codec/quality selection', 'Selected immutable specification and target passed to Session', '12 new channel and source selection tests']}
          data['latestValidation'] = {'run': 38124750626, 'appSha': '1a3dc7045e519689eb66d7560e0b64a63448671d', 'mediaKitSha': '4d8407b9158fa420316581d4f24f5a01591cfa5d', 'flutterPassed': 168, 'pythonJob': 'success', 'bundle': 'success', 'analyze': 'failure_85_existing_infos_plus_4_new_infos_and_1_unused_import', 'freshness': 'failed_library_advanced_during_run', 'kernelSha256': '3fc87b00926b8e033f7c7c33312383638c4dab3a7026d691019b5736e15f8d77', 'newLintRepair': 'this_commit_pending_independent_run', 'fullNativeAcceptance': False, 'deviceTest': False}
          data['requiredWork'] = ['Validate latest App and current media-kit task heads together; source migration is already implemented, do not reimplement.', 'Address85 pre-existing analyzer infos without hiding errors or broad unrelated UI rewrites.', 'Full latest-source native APK/App build and device tests remain required; bundle is not APK.', 'Continue remaining B1, B3, LG managed output and advanced/cross-platform config work from central v3 plan.', 'Resolve legacy Build startup failure without replacing current candidates with historical native inputs.', 'Read both existing PRs and central/App ledgers before resuming.']
          data['nextAction'] = 'Retire this scoped repair workflow, then independently run168 App Flutter tests, Python suite, strict analyze and bundle against latest media-kit. Do not modify library HEAD during combined acceptance. Record actual source vectors and results in PR1/PR4.'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          subprocess.run(['git', 'add', '--', str(page), str(selector), str(path)], check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(app): finish source-query lint cleanup and persist B2b test result [MK-ROUTING-20261011]'
          test "$(git ls-remote origin refs/heads/routing/MK-ROUTING-20261011 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/routing/MK-ROUTING-20261011
