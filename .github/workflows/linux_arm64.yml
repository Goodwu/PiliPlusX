name: Build for Linux arm64

on:
  workflow_call:
    inputs:
      tag:
        required: false
        default: ""
        type: string
  workflow_dispatch:

concurrency:
  group: piliplusx-linux-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-arm64:
    name: Release Linux arm64
    # A native runner is required: Flutter does not cross-build Linux desktop
    # binaries from macOS, and an x86_64 binary must never be labelled arm64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libasound2-dev libmpv-dev dpkg-dev patchelf
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Resolve dependencies and verify lock
        run: |
          flutter pub get --enforce-lockfile
          python3 scripts/verify_media_kit_lock.py pubspec.lock --commit cc7b62b239af113e1eb4d41ea0e7820128908b4b
          python3 scripts/verify_workflow_media_kit_refs.py --commit cc7b62b239af113e1eb4d41ea0e7820128908b4b
      - name: Build Linux arm64
        run: flutter build linux --release --no-pub
      - name: Verify architecture and package tarball
        run: |
          python3 scripts/verify_binary_arch.py build/linux/arm64/release/bundle/piliplus --platform linux --arch arm64
          tar -czf "PiliPlus_linux_${{ inputs.tag }}_arm64.tar.gz" -C build/linux/arm64/release/bundle .
      - name: Package arm64 deb
        run: |
          set -euo pipefail
          pkg="PiliPlus_linux_${{ inputs.tag }}_arm64"
          mkdir -p "$pkg/opt/PiliPlus" "$pkg/usr/share/applications" "$pkg/usr/share/icons/hicolor/512x512/apps"
          cp -a build/linux/arm64/release/bundle/. "$pkg/opt/PiliPlus/"
          cp -a assets/linux/DEBIAN "$pkg/"
          cp assets/linux/com.example.piliplusx.desktop "$pkg/usr/share/applications/"
          cp assets/images/logo/logo.png "$pkg/usr/share/icons/hicolor/512x512/apps/piliplus.png"
          sed -i 's/version_need_change/${{ inputs.tag }}/; s/Architecture: amd64/Architecture: arm64/; s/size_need_change/1/' "$pkg/DEBIAN/control"
          sed -i "s/^Description:.*/Description: PiliPlusX Linux arm64 player/" "$pkg/DEBIAN/control"
          md5sum "$pkg/opt/PiliPlus/piliplus" "$pkg/opt/PiliPlus/lib"/* "$pkg/opt/PiliPlus/data/icudtl.dat" > "$pkg/DEBIAN/md5sums"
          chmod 0644 "$pkg/DEBIAN/control" "$pkg/DEBIAN/md5sums"
          chmod 0755 "$pkg/DEBIAN"/post* "$pkg/DEBIAN"/pre*
          dpkg-deb --build --root-owner-group "$pkg" "PiliPlus_linux_${{ inputs.tag }}_arm64.deb"
          rm -rf "$pkg"
      - name: Generate and verify release metadata
        run: |
          mkdir -p release-metadata/linux-arm64
          cp "PiliPlus_linux_${{ inputs.tag }}_arm64.tar.gz" release-metadata/linux-arm64/
          python3 scripts/release_manifest.py release-metadata/linux-arm64 \
            --platform linux --abi aarch64 \
            --media-kit-commit cc7b62b239af113e1eb4d41ea0e7820128908b4b \
            --hdr-backend wayland-hdr-when-proven-otherwise-tone-map \
            --native-library-version media_kit_libs_linux@1.1.3
          python3 scripts/verify_release_manifest.py release-metadata/linux-arm64
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Linux-arm64-release
          path: |
            PiliPlus_linux_*_arm64.tar.gz
            PiliPlus_linux_*_arm64.deb
            release-metadata/linux-arm64/manifest.json
            release-metadata/linux-arm64/SHA256SUMS
