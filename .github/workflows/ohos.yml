name: Build OHOS unsigned HAP

on:
  pull_request:
    branches:
      - ohos
      - dev-new
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: piliplusx-ohos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ohos:
    name: Build OHOS arm64 unsigned HAP
    runs-on: ubuntu-latest
    env:
      OHOS_WORKSPACE: ${{ runner.temp }}/PiliPlusX-ohos
      PUB_CACHE: ${{ runner.temp }}/pub-cache-ohos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl unzip xz-utils zip libglu1-mesa python3

      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@5c8e74d05fc9888a387b6154ba06d0cd9ede3da1
        with:
          version: 26.0.0.621
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup flutter-ohos
        run: |
          flutter_ohos="$RUNNER_TEMP/flutter-ohos"
          mkdir -p "$flutter_ohos"
          git -C "$flutter_ohos" init
          git -C "$flutter_ohos" remote add origin https://gitcode.com/openharmony-tpc/flutter_flutter.git
          git -C "$flutter_ohos" fetch --depth 1 origin aa76d9bbeee7806a87dbd202d2550dfd11550b82
          git -C "$flutter_ohos" checkout --detach FETCH_HEAD
          git -C "$flutter_ohos" tag -f 3.44.9+ohos aa76d9bbeee7806a87dbd202d2550dfd11550b82
          echo "$RUNNER_TEMP/flutter-ohos/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter OHOS toolchain
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          test "$(git -C "$RUNNER_TEMP/flutter-ohos" rev-parse HEAD)" = "aa76d9bbeee7806a87dbd202d2550dfd11550b82"
          dart --version 2>&1 | grep -F '3.12.2'
          # This fork intentionally has no upstream release tag and reports
          # 0.0.0-unknown to pub. Stamp the verified compatibility version in
          # the local SDK cache so dependency constraints remain enforceable.
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path(__import__("os").environ["RUNNER_TEMP"]) / "flutter-ohos/bin/cache/flutter.version.json"
          data = json.loads(p.read_text())
          data["frameworkVersion"] = data["flutterVersion"] = "3.44.9"
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Apply OHOS Flutter compatibility patches
        run: python3 scripts/prepare_ohos_flutter.py --flutter-root "$RUNNER_TEMP/flutter-ohos" --workspace "$GITHUB_WORKSPACE"

      - name: Prepare isolated OHOS source copy
        run: python3 scripts/prepare_ohos_build.py --workspace "$GITHUB_WORKSPACE" --output "$OHOS_WORKSPACE"

      - name: Prepare unsigned build profile
        run: cp "$OHOS_WORKSPACE/ohos/关于build-profile.json5" "$OHOS_WORKSPACE/ohos/build-profile.json5"

      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          # The OHOS fork has a separate Dart/toolchain resolver from the
          # desktop baseline lock; retain the media-kit SHA gate below while
          # resolving the compatible OHOS dependency graph.
          cd "$OHOS_WORKSPACE"
          flutter pub get
          python3 "$GITHUB_WORKSPACE/scripts/prepare_ohos_material_ui.py" --workspace "$OHOS_WORKSPACE"

      - name: Verify media-kit lock
        run: |
          cd "$OHOS_WORKSPACE"
          python3 scripts/verify_media_kit_lock.py pubspec.lock --commit 73536efdda482f2d5eefe2feb7038db419944b96

      - name: Verify workflow media-kit references
        run: python3 "$GITHUB_WORKSPACE/scripts/verify_workflow_media_kit_refs.py" --workflow-dir "$OHOS_WORKSPACE/.github/workflows" --commit 73536efdda482f2d5eefe2feb7038db419944b96

      - name: Build unsigned HAP
        run: |
          set -euo pipefail
          cd "$OHOS_WORKSPACE"
          grep -F '"enableSignTask": false' ohos/hvigor/hvigor-config.json5
          flutter build hap --release --no-codesign

      - name: Verify HAP ABI
        run: |
          set -euo pipefail
          cd "$OHOS_WORKSPACE"
          hap=$(find build ohos/entry/build -type f -name '*unsigned.hap' -print -quit 2>/dev/null || true)
          test -n "$hap"
          unzip -l "$hap" | tee "$RUNNER_TEMP/hap-contents.txt"
          grep -E 'libs/(arm64-v8a|arm64|aarch64)/' "$RUNNER_TEMP/hap-contents.txt"
          python3 scripts/verify_artifact.py "$hap" --platform ohos --abi arm64-v8a

      - name: Generate HAP manifest
        run: |
          set -euo pipefail
          cd "$OHOS_WORKSPACE"
          hap=$(find build ohos/entry/build -type f -name '*unsigned.hap' -print -quit 2>/dev/null || true)
          test -n "$hap"
          mkdir -p release-metadata/ohos
          cp "$hap" release-metadata/ohos/
          python3 scripts/release_manifest.py release-metadata/ohos \
            --platform ohos --abi arm64-v8a \
            --media-kit-commit 73536efdda482f2d5eefe2feb7038db419944b96 \
            --hdr-backend texture-tone-map \
            --native-library-version media_kit_libs_ohos@1.0.0
          python3 scripts/verify_release_manifest.py release-metadata/ohos

      - name: Upload unsigned HAP and manifest
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: OHOS-arm64-unsigned
          path: |
            ${{ runner.temp }}/PiliPlusX-ohos/release-metadata/ohos/*.hap
            ${{ runner.temp }}/PiliPlusX-ohos/release-metadata/ohos/manifest.json
            ${{ runner.temp }}/PiliPlusX-ohos/release-metadata/ohos/SHA256SUMS
