name: Build for Windows x64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-windows-app:
    name: Release Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml


      - name: Add fastforge and Inno Setup
        run: |
          dart pub global activate fastforge
          choco install innosetup

      - name: Add Chinese language file for Inno Setup
        run: |
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: pwsh

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify media-kit lock
        run: python3 scripts/verify_media_kit_lock.py pubspec.lock --commit cc7b62b239af113e1eb4d41ea0e7820128908b4b

      - name: Verify workflow media-kit references
        run: python3 scripts/verify_workflow_media_kit_refs.py --commit cc7b62b239af113e1eb4d41ea0e7820128908b4b

      - name: Build Windows
        run: |
          fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json,no-pub" --skip-clean

      - name: Prepare Upload
        run: |
          mkdir -p Release/PiliPlusX-Win
          mkdir -p PiliPlusX-Win-Setup
          mv build/windows/x64/runner/Release/* Release/PiliPlusX-Win/
          mv dist/**/*.exe PiliPlusX-Win-Setup/PiliPlusX_windows_${{ inputs.tag }}_x64_setup.exe

      - name: Verify Windows architecture
        run: python scripts/verify_binary_arch.py Release/PiliPlusX-Win/PiliPlusX.exe --platform windows --arch x86_64

      - name: Compress
        run: |
          Compress-Archive -Path "Release/PiliPlusX-Win" -DestinationPath "PiliPlusX_windows_${{ inputs.tag }}_x64_portable.zip"
        shell: pwsh

      - name: Generate Windows release manifest
        run: |
          New-Item -ItemType Directory -Force -Path release-metadata\windows | Out-Null
          Copy-Item PiliPlusX_windows_${{ inputs.tag }}_x64_portable.zip release-metadata\windows\
          Copy-Item PiliPlusX-Win-Setup\PiliPlusX_windows_*_x64_setup.exe release-metadata\windows\
          python scripts/release_manifest.py release-metadata\windows --platform windows --abi x86_64 --media-kit-commit cc7b62b239af113e1eb4d41ea0e7820128908b4b --hdr-backend gpu-next-tone-map --native-library-version media_kit_libs_windows_video@1.0.10
          python scripts/verify_release_manifest.py release-metadata\windows
          Move-Item release-metadata\windows\manifest.json PiliPlusX_windows_${{ inputs.tag }}.manifest.json
          Move-Item release-metadata\windows\SHA256SUMS PiliPlusX_windows_${{ inputs.tag }}.SHA256SUMS

      - name: Release
        if: ${{ inputs.tag != '' && !contains(inputs.tag, 'test') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: true
          prerelease: true
          files: |
            PiliPlusX_windows_*.zip
            PiliPlusX-Win-Setup/PiliPlusX_windows_*.exe
            PiliPlusX_windows_*.manifest.json
            PiliPlusX_windows_*.SHA256SUMS

      - name: Upload windows file release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-file-x64-release
          path: |
            PiliPlusX_windows_*.zip
            PiliPlusX_windows_*.manifest.json
            PiliPlusX_windows_*.SHA256SUMS

      - name: Upload windows setup release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-setup-x64-release
          path: PiliPlusX-Win-Setup/PiliPlusX_windows_*.exe
