name: Build for Windows x64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
      routing-mode:
        description: "Prepare the exact routing source vector and stop before native consumption."
        required: false
        default: false
        type: boolean
      app-sha:
        description: "Exact App commit from the shared routing-vector job."
        required: false
        default: ""
        type: string
      media-kit-sha:
        description: "Exact media-kit commit from the shared routing-vector job."
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      routing-mode:
        description: "Direct dispatch cannot capture the shared routing source vector."
        required: false
        default: false
        type: boolean

jobs:
  build-windows-app:
    name: Windows x64 workflow
    runs-on: windows-latest
    steps:
      - name: Reject uncaptured routing dispatch before any production step
        if: ${{ (inputs.routing-mode && (inputs.app-sha == '' || inputs.media-kit-sha == '')) || (!inputs.routing-mode && inputs.media-kit-sha != '') || (github.ref_name == 'routing/MK-ROUTING-20261011' && !inputs.routing-mode) }}
        shell: pwsh
        run: throw 'Uncaptured routing dispatch is refused; invoke this workflow through build.yml routing-vector.'

      - name: Prepare routing receipts directory
        if: ${{ inputs.routing-mode }}
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/rb/r" | Out-Null

      - name: Configure exact source checkout line endings and path support
        if: ${{ inputs.routing-mode }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Unable to enable Git long paths' }
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Unable to disable Git line conversion' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Unable to set Git LF checkout' }

      - name: Checkout exact App source
        if: ${{ inputs.routing-mode }}
        uses: actions/checkout@v4
        with:
          repository: Goodwu/PiliPlusX
          ref: ${{ inputs.app-sha }}
          path: app
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact media-kit source
        if: ${{ inputs.routing-mode }}
        uses: actions/checkout@v4
        with:
          repository: Goodwu/media-kit
          ref: ${{ inputs.media-kit-sha }}
          path: media-kit
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare isolated current-source SDK and package patches
        if: ${{ inputs.routing-mode }}
        id: prepare
        uses: ./app/.github/actions/routing-bootstrap
        with:
          app-root: app
          media-kit-root: media-kit
          app-sha: ${{ inputs.app-sha }}
          media-kit-sha: ${{ inputs.media-kit-sha }}
          platform: windows

      - name: Verify current media-kit package resolution
        if: ${{ inputs.routing-mode && steps.prepare.outcome == 'success' }}
        working-directory: app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/verify_routing_sources.py --app-root . --media-kit-root ../media-kit --output "$env:RUNNER_TEMP/rb/r/routing-sources-windows.json"
          if ($LASTEXITCODE -ne 0) { throw 'Current media-kit source resolution verification failed' }
          flutter build bundle --debug --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Current-source Flutter bundle build failed' }

      - name: Finalize current-source freshness
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        id: finalize
        working-directory: app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/prepare_routing_ci.py --app-root . --media-kit-root ../media-kit --flutter-root $env:FLUTTER_ROOT --private-root '${{ steps.prepare.outputs.private-root }}' --output "$env:RUNNER_TEMP/rb/r" --expected-app-sha '${{ inputs.app-sha }}' --expected-media-kit-sha '${{ inputs.media-kit-sha }}' --platform windows --finalize
          if ($LASTEXITCODE -ne 0) { throw 'Final current-source freshness verification failed' }

      - name: Fail closed because no current native producer input is available
        if: ${{ inputs.routing-mode && steps.finalize.outcome == 'success' }}
        id: native_block
        shell: pwsh
        env:
          APP_SHA: ${{ inputs.app-sha }}
          MEDIA_KIT_SHA: ${{ inputs.media-kit-sha }}
          ROUTING_RESULTS: ${{ runner.temp }}/rb/r
          NATIVE_ROOT: ${{ runner.temp }}/routing-native-windows
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = [ordered]@{
            taskId = 'MK-ROUTING-20261011'
            stage = 'SOURCE_PREPARED_NATIVE_BLOCKED'
            status = 'windows-current-native-input-unavailable'
            platform = 'windows'
            appCommit = $env:APP_SHA
            mediaKitCommit = $env:MEDIA_KIT_SHA
            bootstrapReceipt = (Join-Path $env:ROUTING_RESULTS 'bootstrap.json')
            bootstrapStatus = 'fresh-source-only'
            currentConsumer = 'media_kit_video/windows/CMakeLists.txt -> Flutter Windows CMake consumer'
            previousDownloadUrls = @('https://github.com/Predidit/libmpv-win32-video-cmake/releases/download/20260811/mpv-dev-x86_64-20260811-git-ad59ff1.7z')
            currentProducerReceipt = $null
            currentProducerReceiptStatus = 'not-provided-to-this-workflow'
            nativeInputRoot = $env:NATIVE_ROOT
            nativeInputRootExists = (Test-Path -LiteralPath $env:NATIVE_ROOT)
            nativeBinaryProvenanceVerified = $false
            deviceTest = $false
          }
          $json = $diagnostic | ConvertTo-Json -Depth 8
          [System.IO.File]::WriteAllText((Join-Path $env:ROUTING_RESULTS 'windows-native-blocked.json'), $json + "`n", [System.Text.UTF8Encoding]::new($false))
          throw 'SOURCE_PREPARED_NATIVE_BLOCKED: current native producer receipt and accepted local input are unavailable.'

      - name: Upload routing source and native availability diagnostics
        if: ${{ always() && inputs.routing-mode }}
        uses: actions/upload-artifact@v4
        with:
          name: routing-windows-source-native-diagnostics-${{ inputs.app-sha }}
          path: ${{ runner.temp }}/rb/r
          if-no-files-found: error
          retention-days: 14

      - name: Checkout code
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml


      - name: Add fastforge and Inno Setup
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        run: |
          dart pub global activate fastforge
          choco install innosetup

      - name: Add Chinese language file for Inno Setup
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        run: |
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: pwsh

      - name: Set and Extract version
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Resolve locked dependencies
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        run: flutter pub get --enforce-lockfile

      - name: Patch extended nested scroll view pointer boundary
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        run: python3 scripts/prepare_ohos_package_patches.py --workspace "$GITHUB_WORKSPACE"

      - name: Verify media-kit lock
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        run: python3 scripts/verify_media_kit_lock.py pubspec.lock --commit 73536efdda482f2d5eefe2feb7038db419944b96

      - name: Verify workflow media-kit references
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        run: python3 scripts/verify_workflow_media_kit_refs.py --commit 73536efdda482f2d5eefe2feb7038db419944b96

      - name: Build Windows
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        run: |
          fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json,no-pub" --skip-clean

      - name: Prepare Upload
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        run: |
          mkdir -p Release/PiliPlusX-Win
          mkdir -p PiliPlusX-Win-Setup
          mv build/windows/x64/runner/Release/* Release/PiliPlusX-Win/
          mv dist/**/*.exe PiliPlusX-Win-Setup/PiliPlusX_windows_${{ inputs.tag }}_x64_setup.exe

      - name: Verify Windows architecture
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        run: python scripts/verify_binary_arch.py Release/PiliPlusX-Win/PiliPlusX.exe --platform windows --arch x86_64

      - name: Compress
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        run: |
          Compress-Archive -Path "Release/PiliPlusX-Win" -DestinationPath "PiliPlusX_windows_${{ inputs.tag }}_x64_portable.zip"
        shell: pwsh

      - name: Generate Windows release manifest
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        run: |
          New-Item -ItemType Directory -Force -Path release-metadata\windows | Out-Null
          Copy-Item PiliPlusX_windows_${{ inputs.tag }}_x64_portable.zip release-metadata\windows\
          Copy-Item PiliPlusX-Win-Setup\PiliPlusX_windows_*_x64_setup.exe release-metadata\windows\
          python scripts/release_manifest.py release-metadata\windows --platform windows --abi x86_64 --media-kit-commit 73536efdda482f2d5eefe2feb7038db419944b96 --hdr-backend gpu-next-tone-map --native-library-version media_kit_libs_windows_video@1.0.10
          python scripts/verify_release_manifest.py release-metadata\windows
          Move-Item release-metadata\windows\manifest.json PiliPlusX_windows_${{ inputs.tag }}.manifest.json
          Move-Item release-metadata\windows\SHA256SUMS PiliPlusX_windows_${{ inputs.tag }}.SHA256SUMS

      - name: Release
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' && inputs.tag != '' && !contains(inputs.tag, 'test') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: true
          prerelease: true
          files: |
            PiliPlusX_windows_*.zip
            PiliPlusX-Win-Setup/PiliPlusX_windows_*.exe
            PiliPlusX_windows_*.manifest.json
            PiliPlusX_windows_*.SHA256SUMS

      - name: Upload windows file release
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-file-x64-release
          path: |
            PiliPlusX_windows_*.zip
            PiliPlusX_windows_*.manifest.json
            PiliPlusX_windows_*.SHA256SUMS

      - name: Upload windows setup release
        if: ${{ !inputs.routing-mode && inputs.media-kit-sha == '' && github.ref_name != 'routing/MK-ROUTING-20261011' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-setup-x64-release
          path: PiliPlusX-Win-Setup/PiliPlusX_windows_*.exe
