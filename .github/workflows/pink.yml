name: Build for Android Pink

on:
  workflow_call:
    outputs:
      staging-id:
        value: ${{ jobs.android.outputs.staging-id }}
    inputs:
      routing-mode:
        type: boolean
        default: false
      app-sha:
        type: string
        default: ''
      media-kit-sha:
        type: string
        default: ''
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        type: string
        default: ''

jobs:
    android:
        name: Release Android Pink
        outputs:
            staging-id: ${{ steps.routing_staging.outputs.artifact-id }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: read
        steps:
            - name: Reject uncaptured routing dispatch
              if: ${{ github.ref_name == 'routing/MK-ROUTING-20261011' && !inputs.routing-mode }}
              run: |
                echo 'Routing Android/Pink requires the Build caller captured source vector and native input gates.' >&2
                exit 1
            # BEGIN ROUTING ANDROID
            - name: Initialize routing native diagnostics
              if: ${{ inputs.routing-mode }}
              shell: bash
              run: |
                set -euo pipefail
                git config --global core.autocrlf false
                git config --global core.eol lf
                git config --global core.longpaths true
                printf 'ROUTING_RESULTS=%s\nEXPECTED_APP_SHA=%s\nEXPECTED_MEDIA_KIT_SHA=%s\nROUTING_STAGE=%s\n' "$RUNNER_TEMP/rb/r" '${{ inputs.app-sha }}' '${{ inputs.media-kit-sha }}' "$RUNNER_TEMP/routing-pink-staging" >> "$GITHUB_ENV"
                mkdir -p "$RUNNER_TEMP/rb/r"
            - name: Checkout exact routing App
              if: ${{ inputs.routing-mode }}
              uses: actions/checkout@v7
              with:
                ref: ${{ inputs.app-sha }}
                path: app
                fetch-depth: 0
                persist-credentials: false
            - name: Checkout exact routing library
              if: ${{ inputs.routing-mode }}
              uses: actions/checkout@v7
              with:
                repository: Goodwu/media-kit
                ref: ${{ inputs.media-kit-sha }}
                path: media-kit
                persist-credentials: false
            - name: Verify routing App base
              if: ${{ inputs.routing-mode }}
              working-directory: app
              shell: bash
              run: |
                set -euo pipefail
                git fetch --no-tags origin fix/darwin-video-output-rebuild-barrier
                git merge-base --is-ancestor FETCH_HEAD HEAD
            - name: Bootstrap actual routing Android patches
              if: ${{ inputs.routing-mode }}
              id: routing_prepare
              uses: ./app/.github/actions/routing-bootstrap
              with:
                app-root: app
                media-kit-root: media-kit
                app-sha: ${{ env.EXPECTED_APP_SHA }}
                media-kit-sha: ${{ env.EXPECTED_MEDIA_KIT_SHA }}
                platform: android
            - name: Acquire explicitly accepted native input before Gradle
              if: ${{ inputs.routing-mode }}
              id: routing_native
              working-directory: app
              shell: bash
              env:
                GH_TOKEN: ${{ github.token }}
              run: |
                set -euo pipefail
                python3 scripts/acquire_routing_native_inputs.py --output "$RUNNER_TEMP/native-input-pink" --receipt "$ROUTING_RESULTS/native-acquire.json" --app-commit "$EXPECTED_APP_SHA" --media-kit-commit "$EXPECTED_MEDIA_KIT_SHA" --readelf "${ANDROID_NDK_HOME:-/missing-ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --nm "${ANDROID_NDK_HOME:-/missing-ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
            - name: Prepare immutable routing pink variant
              if: ${{ inputs.routing-mode }}
              id: routing_variant
              working-directory: app
              shell: bash
              run: |
                set -euo pipefail
                python3 scripts/prepare_android_variant.py --source "$GITHUB_WORKSPACE/app" --media-kit-root "$GITHUB_WORKSPACE/media-kit" --variant "$RUNNER_TEMP/av/pink/app" --receipt "$ROUTING_RESULTS/variant.json" --bootstrap "$ROUTING_RESULTS/bootstrap.json" --app-commit "$EXPECTED_APP_SHA" --media-kit-commit "$EXPECTED_MEDIA_KIT_SHA" --flavor pink --manifest-parser "$GITHUB_WORKSPACE/app/android/tool/parse_routing_manifest.dart"
                python3 scripts/verify_media_kit_lock.py "$RUNNER_TEMP/av/pink/app/pubspec.lock" --mode routing --commit "$EXPECTED_MEDIA_KIT_SHA" --app-commit "$EXPECTED_APP_SHA" --source-app-root "$GITHUB_WORKSPACE/app" --variant-root "$RUNNER_TEMP/av/pink/app" --media-kit-root "$GITHUB_WORKSPACE/media-kit" --variant-receipt "$ROUTING_RESULTS/variant.json"
                python3 scripts/verify_workflow_media_kit_refs.py --mode routing --commit "$EXPECTED_MEDIA_KIT_SHA" --workflow-dir .github/workflows
            - name: Set up routing Java
              if: ${{ inputs.routing-mode }}
              uses: actions/setup-java@v5
              with:
                distribution: zulu
                java-version: '17'
            - name: Build routing Release APK with verified local arm64 input
              if: ${{ inputs.routing-mode }}
              id: routing_build
              working-directory: ${{ steps.routing_variant.outputs.variant }}
              shell: bash
              env:
                VERIFIED_JAR: ${{ steps.routing_native.outputs.jar }}
              run: |
                set -euo pipefail
                python3 "$GITHUB_WORKSPACE/app/scripts/prepare_android_variant.py" --source "$GITHUB_WORKSPACE/app" --media-kit-root "$GITHUB_WORKSPACE/media-kit" --variant "$RUNNER_TEMP/av/pink/app" --receipt "$ROUTING_RESULTS/variant.json" --bootstrap "$ROUTING_RESULTS/bootstrap.json" --app-commit "$EXPECTED_APP_SHA" --media-kit-commit "$EXPECTED_MEDIA_KIT_SHA" --flavor pink --manifest-parser "$GITHUB_WORKSPACE/app/android/tool/parse_routing_manifest.dart" --check-prebuild
                flutter build apk --release --split-per-abi --target-platform android-arm64 --android-project-arg=dev=1 --android-project-arg=mediaKitLocalArm64Jar="$VERIFIED_JAR" --android-project-arg=mediaKitArm64Only=true --no-pub 2>&1 | tee "$ROUTING_RESULTS/apk-build.log"
            - name: Verify routing APK native members ABI and signature
              if: ${{ inputs.routing-mode }}
              id: routing_packaged
              working-directory: app
              shell: bash
              env:
                VERIFIED_JAR: ${{ steps.routing_native.outputs.jar }}
                VERIFIED_MANIFEST: ${{ steps.routing_native.outputs.manifest }}
                VERIFIED_EVIDENCE: ${{ steps.routing_native.outputs.evidenceRoot }}
                ROUTING_VARIANT: ${{ steps.routing_variant.outputs.variant }}
              run: |
                set -euo pipefail
                apk="$ROUTING_VARIANT/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
                test -s "$apk"
                python3 scripts/verify_routing_native_inputs.py --jar "$VERIFIED_JAR" --manifest "$VERIFIED_MANIFEST" --evidence-root "$VERIFIED_EVIDENCE" --apk "$apk" --app-commit "$EXPECTED_APP_SHA" --media-kit-commit "$EXPECTED_MEDIA_KIT_SHA" --readelf "${ANDROID_NDK_HOME:-/missing-ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --nm "${ANDROID_NDK_HOME:-/missing-ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" --receipt "$ROUTING_RESULTS/native-after.json"
                python3 scripts/verify_artifact.py "$apk" --platform android --abi arm64-v8a
                apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
                test -x "$apksigner"
                "$apksigner" verify --verbose "$apk" | tee "$ROUTING_RESULTS/apk-signature.log"
            - name: Finalize routing variant after build
              if: ${{ !cancelled() && inputs.routing-mode && steps.routing_variant.outcome == 'success' }}
              working-directory: app
              shell: bash
              run: |
                set -euo pipefail
                python3 scripts/prepare_android_variant.py --source "$GITHUB_WORKSPACE/app" --media-kit-root "$GITHUB_WORKSPACE/media-kit" --variant "$RUNNER_TEMP/av/pink/app" --receipt "$ROUTING_RESULTS/variant.json" --bootstrap "$ROUTING_RESULTS/bootstrap.json" --app-commit "$EXPECTED_APP_SHA" --media-kit-commit "$EXPECTED_MEDIA_KIT_SHA" --flavor pink --manifest-parser "$GITHUB_WORKSPACE/app/android/tool/parse_routing_manifest.dart" --finalize
            - name: Finalize original routing sources and freshness
              if: ${{ !cancelled() && inputs.routing-mode && steps.routing_prepare.outcome == 'success' }}
              working-directory: app
              shell: bash
              run: |
                set -euo pipefail
                python3 scripts/prepare_routing_ci.py --app-root . --media-kit-root ../media-kit --flutter-root "$FLUTTER_ROOT" --private-root "${{ steps.routing_prepare.outputs.private-root }}" --output "$ROUTING_RESULTS" --expected-app-sha "$EXPECTED_APP_SHA" --expected-media-kit-sha "$EXPECTED_MEDIA_KIT_SHA" --platform android --finalize
            - name: Stage verified routing APK pending cross-variant parity
              if: ${{ success() && inputs.routing-mode }}
              shell: bash
              env:
                ROUTING_VARIANT: ${{ steps.routing_variant.outputs.variant }}
              run: |
                set -euo pipefail
                mkdir "$ROUTING_STAGE"
                cp "$ROUTING_VARIANT/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "$ROUTING_STAGE/PiliPlusX_routing_pink_arm64-v8a.apk"
                cp "$ROUTING_RESULTS/native-after.json" "$ROUTING_RESULTS/variant.json" "$ROUTING_RESULTS/bootstrap.json" "$ROUTING_RESULTS/apk-signature.log" "$ROUTING_STAGE/"
                printf 'pending-parity=true\napp=%s\nmedia-kit=%s\ndeviceVerified=false\n' "$EXPECTED_APP_SHA" "$EXPECTED_MEDIA_KIT_SHA" > "$ROUTING_STAGE/source.txt"
            - name: Upload routing staging evidence only
              id: routing_staging
              if: ${{ success() && inputs.routing-mode }}
              uses: actions/upload-artifact@v7
              with:
                name: routing-pink-staging
                path: ${{ env.ROUTING_STAGE }}
                if-no-files-found: error
            - name: Upload routing native failure diagnostics
              if: ${{ always() && inputs.routing-mode }}
              uses: actions/upload-artifact@v7
              with:
                name: routing-pink-diagnostics-${{ env.EXPECTED_APP_SHA }}
                path: ${{ env.ROUTING_RESULTS }}
                if-no-files-found: error
            # END ROUTING ANDROID
            - name: 代码迁出
              if: ${{ !(inputs.routing-mode) }}
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Rename package
              if: ${{ !(inputs.routing-mode) }}
              run: |
                export LC_ALL=C
                sed -i 's/androidInfo\.supportedAbis\.first/"pink"/g' lib/utils/update.dart
                sed -i 's/com\.example\.piliplusx/tv\.danmaku\.bili/g' \
                  android/app/build.gradle.kts \
                  android/app/src/profile/AndroidManifest.xml \
                  android/app/src/main/AndroidManifest.xml \
                  android/app/src/main/kotlin/com/example/piliplusx/MainActivity.kt \
                  android/app/src/main/kotlin/com/example/piliplusx/Utils.kt \
                  android/app/src/main/kotlin/com/example/piliplusx/BiliDocumentsProvider.kt \
                  android/app/src/main/java/com/example/piliplusx/AndroidHelper.java \
                  android/app/src/main/java/com/example/piliplusx/MediaHelper.java \
                  android/app/src/main/res/xml-v25/shortcuts.xml \
                  lib/services/audio_handler.dart
                sed -i 's|com/example/piliplusx|tv/danmaku/bili|g' lib/utils/android/bindings.g.dart
                grep -n '"pink"' lib/utils/update.dart || echo "update.dart 替换失败"
                grep -n 'tv\.danmaku\.bili' android/app/build.gradle.kts | head -2 || echo "build.gradle.kts 替换失败"
              shell: bash

            - name: Verify HDR channel contract after Pink rename
              if: ${{ !(inputs.routing-mode) }}
              run: python3 scripts/verify_hdr_channel.py

            - name: 构建Java环境
              if: ${{ !(inputs.routing-mode) }}
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              if: ${{ !(inputs.routing-mode) }}
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              if: ${{ !(inputs.routing-mode) }}
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Resolve locked dependencies
              if: ${{ !(inputs.routing-mode) }}
              run: flutter pub get --enforce-lockfile

            - name: Patch extended nested scroll view pointer boundary
              if: ${{ !(inputs.routing-mode) }}
              run: python3 scripts/prepare_ohos_package_patches.py --workspace "$GITHUB_WORKSPACE"

            - name: Verify media-kit lock
              if: ${{ !(inputs.routing-mode) }}
              run: python3 scripts/verify_media_kit_lock.py pubspec.lock --commit 73536efdda482f2d5eefe2feb7038db419944b96

            - name: Verify workflow media-kit references
              if: ${{ !(inputs.routing-mode) }}
              run: python3 scripts/verify_workflow_media_kit_refs.py --commit 73536efdda482f2d5eefe2feb7038db419944b96

            - name: Write key
              if: ${{ !(inputs.routing-mode) && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) }}
              run: |
                  if [ ! -z "${{ secrets.KEYSTORE_FILE }}" ]; then
                    echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android/app/key.jks
                    {
                      echo storeFile='key.jks'
                      echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}'
                      echo keyAlias='${{ secrets.KEY_ALIAS }}'
                      echo keyPassword='${{ secrets.KEY_PASSWORD }}'
                    } >> android/key.properties
                  fi

            - name: Set and Extract version
              if: ${{ !(inputs.routing-mode) && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) }}
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Release Apk
              if: ${{ !(inputs.routing-mode) && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) }}
              run: flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define-from-file=pili_release.json --no-pub

            - name: Flutter Build Dev Apk
              if: ${{ !(inputs.routing-mode) && (github.event_name == 'pull_request') }}
              run: |
                flutter build apk --release --split-per-abi --target-platform android-arm64 --android-project-arg dev=1 --no-pub

            - name: Rename
              if: ${{ !(inputs.routing-mode) }}
              run: |
                  tag_name=${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
                  mv build/app/outputs/flutter-apk/app-release.apk "PiliPlusX_android_${tag_name}_pink.apk"
              shell: bash

            - name: Verify Android Pink ABI
              if: ${{ !(inputs.routing-mode) }}
              run: |
                  apk=$(find . -maxdepth 1 -name 'PiliPlusX_android_*_pink.apk' -print -quit)
                  python3 scripts/verify_artifact.py "$apk" --platform android --abi arm64-v8a

            - name: Generate Pink release manifest
              if: ${{ !(inputs.routing-mode) }}
              run: |
                  apk=$(find . -maxdepth 1 -name 'PiliPlusX_android_*_pink.apk' -print -quit)
                  mkdir -p release-metadata/pink
                  cp "$apk" release-metadata/pink/
                  python3 scripts/release_manifest.py release-metadata/pink \
                    --platform android-pink --abi arm64-v8a \
                    --media-kit-commit 73536efdda482f2d5eefe2feb7038db419944b96 \
                    --hdr-backend android-hcpp-platform-view \
                    --native-library-version media_kit_libs_android_video@1.3.6
                  python3 scripts/verify_release_manifest.py release-metadata/pink
                  mv release-metadata/pink/manifest.json "${apk%.apk}.manifest.json"
                  mv release-metadata/pink/SHA256SUMS "${apk%.apk}.SHA256SUMS"

            - name: Release
              if: ${{ !(inputs.routing-mode) && github.ref_name != 'routing/MK-ROUTING-20261011' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && !contains(github.event.inputs.tag, 'test')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'test'))) }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
                  name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
                  draft: true
                  prerelease: true
                  files: |
                      PiliPlusX_android_*_pink.apk
                      PiliPlusX_android_*_pink.manifest.json
                      PiliPlusX_android_*_pink.SHA256SUMS

            - name: Upload Pink release
              if: ${{ !(inputs.routing-mode) }}
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_Pink
                  path: |
                      PiliPlusX_android_*_pink.apk
                      PiliPlusX_android_*_pink.manifest.json
                      PiliPlusX_android_*_pink.SHA256SUMS
