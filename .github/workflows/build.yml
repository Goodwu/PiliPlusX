name: Build

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
        paths-ignore:
            - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            build_pink:
                description: "Build Android Pink"
                required: false
                default: true
                type: boolean

            build_ios:
                description: "Build iOS"
                required: false
                default: true
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: true
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: true
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: true
                type: boolean

            build_linux_arm64:
                description: "Build Linux-arm64"
                required: false
                default: true
                type: boolean

            run_hdr_unit_tests:
                description: "Run HDR decision unit tests"
                required: false
                default: false
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

concurrency:
    group: piliplusx-build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    hdr_unit_tests:
        if: ${{ github.event_name == 'pull_request' || inputs.run_hdr_unit_tests == true }}
        name: HDR decision tests
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Resolve locked dependencies
              run: flutter pub get --enforce-lockfile

            - name: Patch extended nested scroll view pointer boundary
              run: python3 scripts/prepare_ohos_package_patches.py --workspace "$GITHUB_WORKSPACE"

            - name: Verify media-kit lock
              run: python3 scripts/verify_media_kit_lock.py pubspec.lock --commit 73536efdda482f2d5eefe2feb7038db419944b96

            - name: Verify workflow media-kit references
              run: python3 scripts/verify_workflow_media_kit_refs.py --commit 73536efdda482f2d5eefe2feb7038db419944b96

            - name: Verify HDR channel contract
              run: python3 scripts/verify_hdr_channel.py

            - name: Run release verifier tests
              run: python3 -m unittest discover -s test -p '*_test.py'

            - name: Run HDR decision tests
              run: flutter test test/plugin/pl_player/hdr_test.dart

    android:
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.build_android == 'true' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Resolve locked dependencies
              run: flutter pub get --enforce-lockfile

            - name: Patch extended nested scroll view pointer boundary
              run: python3 scripts/prepare_ohos_package_patches.py --workspace "$GITHUB_WORKSPACE"

            - name: Verify media-kit lock
              run: python3 scripts/verify_media_kit_lock.py pubspec.lock --commit 73536efdda482f2d5eefe2feb7038db419944b96

            - name: Verify workflow media-kit references
              run: python3 scripts/verify_workflow_media_kit_refs.py --commit 73536efdda482f2d5eefe2feb7038db419944b96

            - name: Write key
              if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
              run: |
                  if [ ! -z "${{ secrets.KEYSTORE_FILE }}" ]; then
                    echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android/app/key.jks
                    echo storeFile='key.jks' >> android/key.properties
                    echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
                    echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
                    echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
                  fi

            - name: Set and Extract version
              if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Release Apk
              if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
              run: flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define-from-file=pili_release.json --no-pub

            - name: Flutter Build Dev Apk
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                flutter build apk --release --split-per-abi --target-platform android-arm64 --android-project-arg dev=1 --no-pub

            - name: Rename
              run: |
                  tag_name=${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
                  mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "PiliPlusX_android_${tag_name}_arm64-v8a.apk"
              shell: bash

            - name: Verify Android ABI
              run: |
                  apk=$(find . -maxdepth 1 -name 'PiliPlusX_android_*_arm64-v8a.apk' -print -quit)
                  python3 scripts/verify_artifact.py "$apk" --platform android --abi arm64-v8a

            - name: Generate Android release manifest
              run: |
                  apk=$(find . -maxdepth 1 -name 'PiliPlusX_android_*_arm64-v8a.apk' -print -quit)
                  mkdir -p release-metadata/android
                  cp "$apk" release-metadata/android/
                  python3 scripts/release_manifest.py release-metadata/android \
                    --platform android --abi arm64-v8a \
                    --media-kit-commit 73536efdda482f2d5eefe2feb7038db419944b96 \
                    --hdr-backend android-hcpp-platform-view \
                    --native-library-version media_kit_libs_android_video@1.3.6
                  python3 scripts/verify_release_manifest.py release-metadata/android
                  mv release-metadata/android/manifest.json "${apk%.apk}.manifest.json"
                  mv release-metadata/android/SHA256SUMS "${apk%.apk}.SHA256SUMS"

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: |
                      PiliPlusX_android_*_arm64-v8a.apk
                      PiliPlusX_android_*_arm64-v8a.manifest.json
                      PiliPlusX_android_*_arm64-v8a.SHA256SUMS

    pink:
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.build_pink == 'true' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        uses: ./.github/workflows/pink.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'push' && github.ref_name || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '') }}

    verify_android_native_parity:
        if: ${{ needs.android.result == 'success' && needs.pink.result == 'success' }}
        needs: [android, pink]
        name: Verify Android/Pink native parity
        runs-on: ubuntu-latest
        steps:
            - name: Checkout verification scripts
              uses: actions/checkout@v7

            - name: Download Android artifact
              uses: actions/download-artifact@v7
              with:
                  name: Android_arm64-v8a
                  path: android-artifact

            - name: Download Pink artifact
              uses: actions/download-artifact@v7
              with:
                  name: Android_Pink
                  path: pink-artifact

            - name: Verify identical arm64 native libraries
              run: |
                  android_apk=$(find android-artifact -name '*.apk' -print -quit)
                  pink_apk=$(find pink-artifact -name '*.apk' -print -quit)
                  python3 scripts/verify_android_native_parity.py "$android_apk" "$pink_apk"

    ios:
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.build_ios == 'true' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        uses: ./.github/workflows/ios.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'push' && github.ref_name || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '') }}

    mac:
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.build_mac == 'true' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        uses: ./.github/workflows/mac.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'push' && github.ref_name || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '') }}

    win_x64:
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.build_win_x64 == 'true' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        uses: ./.github/workflows/win_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'push' && github.ref_name || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '') }}

    linux_x64:
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.build_linux_x64 == 'true' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        uses: ./.github/workflows/linux_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'push' && github.ref_name || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '') }}

    linux_arm64:
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_linux_arm64 == true || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        uses: ./.github/workflows/linux_arm64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'push' && github.ref_name || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '') }}
