name: Build for iOS

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify media-kit lock
        run: python3 scripts/verify_media_kit_lock.py pubspec.lock --commit 73536efdda482f2d5eefe2feb7038db419944b96

      - name: Verify workflow media-kit references
        run: python3 scripts/verify_workflow_media_kit_refs.py --commit 73536efdda482f2d5eefe2feb7038db419944b96

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          # make AltSign happy...
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 PiliPlusX_ios_${{ inputs.tag }}.ipa Payload/Runner.app

      - name: Verify iOS architecture
        run: python3 scripts/verify_binary_arch.py Payload/Runner.app/Runner --platform ios --arch arm64

      - name: Generate iOS release manifest
        run: |
          mkdir -p release-metadata/ios
          cp PiliPlusX_ios_*.ipa release-metadata/ios/
          python3 scripts/release_manifest.py release-metadata/ios \
            --platform ios --abi arm64 \
            --media-kit-commit 73536efdda482f2d5eefe2feb7038db419944b96 \
            --hdr-backend texture-tone-map \
            --native-library-version media_kit_libs_ios_video@1.1.4
          python3 scripts/verify_release_manifest.py release-metadata/ios
          mv release-metadata/ios/manifest.json PiliPlusX_ios_${{ inputs.tag }}.manifest.json
          mv release-metadata/ios/SHA256SUMS PiliPlusX_ios_${{ inputs.tag }}.SHA256SUMS

      - name: Release
        if: ${{ inputs.tag != '' && !contains(inputs.tag, 'test') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: true
          prerelease: true
          files: |
            PiliPlusX_ios_*.ipa
            PiliPlusX_ios_*.manifest.json
            PiliPlusX_ios_*.SHA256SUMS

      - name: Upload ios release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: iOS-release
          path: |
            PiliPlusX_ios_*.ipa
            PiliPlusX_ios_*.manifest.json
            PiliPlusX_ios_*.SHA256SUMS
