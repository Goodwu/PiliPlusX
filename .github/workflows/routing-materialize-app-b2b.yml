name: Materialize reviewed App B2b checkpoint
on:
  push:
    branches: [routing/MK-ROUTING-20261011]
    paths: ['.github/workflows/routing-materialize-app-b2b.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify and apply the exact reviewed App patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/routing/MK-ROUTING-20261011 | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 8fc8f2c618b96b60b29d576e4242d0e153fd00bd HEAD
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          root = pathlib.Path('scripts/routing-migration-transport')
          patch = lzma.decompress(base64.b64decode(''.join((root / f'part{i}.b64').read_text() for i in (1, 2, 3)), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4514fe1c429fb13c15aec1ddada93259f810a396550c97918fbd208c772eb818'
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(paths) == {
              'docs/plans/media-kit-routing-app-handoff-20261011.json',
              'lib/pages/video/controller.dart',
              'lib/pages/video/video_quality_eligibility.dart',
              'lib/pages/video/view.dart',
              'lib/plugin/pl_player/controller.dart',
              'lib/plugin/pl_player/hdr_output.dart',
              'lib/plugin/pl_player/models/data_source.dart',
              'lib/plugin/pl_player/source_selection.dart',
              'test/plugin/pl_player/source_selection_test.dart',
          }
          subprocess.run(['dart', 'format', *[p for p in paths if p.endswith('.dart')]], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git diff --cached --check
          git rm scripts/routing-migration-transport/part*.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(app): filter DASH sources with target-aware decoder capabilities [MK-ROUTING-20261011 B2b]'
          test "$(git ls-remote origin refs/heads/routing/MK-ROUTING-20261011 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/routing/MK-ROUTING-20261011
