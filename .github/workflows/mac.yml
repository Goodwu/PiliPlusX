name: Build for Mac

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-mac-app:
    name: Release Mac
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 macOS

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Patch extended nested scroll view pointer boundary
        run: python3 scripts/prepare_ohos_package_patches.py --workspace "$GITHUB_WORKSPACE"

      - name: Verify media-kit lock
        run: python3 scripts/verify_media_kit_lock.py pubspec.lock --commit 73536efdda482f2d5eefe2feb7038db419944b96

      - name: Verify workflow media-kit references
        run: python3 scripts/verify_workflow_media_kit_refs.py --commit 73536efdda482f2d5eefe2feb7038db419944b96

      - name: Build Mac
        run: |
          flutter build macos --release --dart-define-from-file=pili_release.json --no-pub

      - name: Verify macOS architecture
        run: python3 scripts/verify_binary_arch.py build/macos/Build/Products/Release/PiliPlusX.app/Contents/MacOS/PiliPlusX --platform macos --arch arm64

      - name: Prepare Upload
        run: |
          npm install --global create-dmg
          create-dmg build/macos/Build/Products/Release/PiliPlusX.app

      - name: Rename DMG
        run: mv PiliPlusX*.dmg PiliPlusX_macos_${{ inputs.tag }}.dmg

      - name: Generate macOS release manifest
        run: |
          mkdir -p release-metadata/macos
          cp PiliPlusX_macos_${{ inputs.tag }}.dmg release-metadata/macos/
          python3 scripts/release_manifest.py release-metadata/macos \
            --platform macos --abi arm64 \
            --media-kit-commit 73536efdda482f2d5eefe2feb7038db419944b96 \
            --hdr-backend texture-tone-map \
            --native-library-version media_kit_libs_macos_video@1.1.4
          python3 scripts/verify_release_manifest.py release-metadata/macos
          mv release-metadata/macos/manifest.json PiliPlusX_macos_${{ inputs.tag }}.manifest.json
          mv release-metadata/macos/SHA256SUMS PiliPlusX_macos_${{ inputs.tag }}.SHA256SUMS

      - name: Release
        if: ${{ inputs.tag != '' && !contains(inputs.tag, 'test') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: true
          prerelease: true
          files: |
            PiliPlusX_macos_${{ inputs.tag }}.dmg
            PiliPlusX_macos_${{ inputs.tag }}.manifest.json
            PiliPlusX_macos_${{ inputs.tag }}.SHA256SUMS

      - name: Upload macos release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: macOS-release
          path: |
            PiliPlusX_macos_*.dmg
            PiliPlusX_macos_*.manifest.json
            PiliPlusX_macos_*.SHA256SUMS
