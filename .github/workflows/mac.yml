name: Build for Mac

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: true
        type: string
      ref:
        description: Immutable source commit to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Asset label for an ad-hoc build
        required: true
        type: string

jobs:
  build-mac-app:
    name: macOS arm64
    runs-on: macos-26
    permissions:
      contents: read
    env:
      PILIPLUSX_RELEASE_TAG: ${{ inputs.tag }}
      PILIPLUSX_SOURCE_SHA: ${{ inputs.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Use reproducible dependencies
        run: scripts/prepare_ci_dependencies.sh

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 macOS

      - name: Resolve pinned dependencies
        run: flutter pub get

      - name: Patch extended nested scroll view pointer boundary
        run: python3 scripts/prepare_ohos_package_patches.py --workspace "$GITHUB_WORKSPACE"

      - name: Verify media-kit lock
        run: python3 scripts/verify_media_kit_lock.py pubspec.lock --commit 0fa6afe9cd9af8d8437919257d81a27c643f2f63

      - name: Build Mac
        run: |
          flutter build macos --release --dart-define-from-file=pili_release.json --no-pub

      - name: Fetch pinned mpv 0.41 archive
        run: scripts/fetch_goodwu_mpv_archive.sh "$RUNNER_TEMP/libmpv-macos.tar.gz"

      - name: Bundle mpv 0.41 runtime closure
        run: |
          brew install libplacebo shaderc vulkan-loader little-cms2
          scripts/package_macos_goodwu_mpv_hdr.sh \
            build/macos/Build/Products/Release/PiliPlusX.app \
            "$RUNNER_TEMP/libmpv-macos.tar.gz" \
            build/macos/Build/Products/Release/PiliPlusX-mpv041.app

      - name: Verify macOS architecture
        run: |
          app=build/macos/Build/Products/Release/PiliPlusX-mpv041.app
          python3 scripts/verify_binary_arch.py "$app/Contents/MacOS/PiliPlusX" --platform macos --arch arm64
          codesign --verify --deep --strict "$app"

      - name: Prepare Upload
        run: |
          npm install --global create-dmg
          create-dmg build/macos/Build/Products/Release/PiliPlusX-mpv041.app

      - name: Rename DMG
        run: mv PiliPlusX*.dmg PiliPlusX_macos_${{ inputs.tag }}.dmg

      - name: Generate macOS release manifest
        run: |
          mkdir -p release-metadata/macos
          cp PiliPlusX_macos_${{ inputs.tag }}.dmg release-metadata/macos/
          python3 scripts/release_manifest.py release-metadata/macos \
            --platform macos --abi arm64 \
            --media-kit-commit 0fa6afe9cd9af8d8437919257d81a27c643f2f63 \
            --hdr-backend texture-tone-map \
            --native-library-version Goodwu_libmpv_macos@0.41.0+bc52bba
          python3 scripts/verify_release_manifest.py release-metadata/macos
          mv release-metadata/macos/manifest.json PiliPlusX_macos_${{ inputs.tag }}.manifest.json
          mv release-metadata/macos/SHA256SUMS PiliPlusX_macos_${{ inputs.tag }}.SHA256SUMS

      - name: Upload macos release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          name: release-macos-arm64
          path: |
            PiliPlusX_macos_*.dmg
            PiliPlusX_macos_*.manifest.json
            PiliPlusX_macos_*.SHA256SUMS
